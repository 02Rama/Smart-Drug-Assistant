<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Drug Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#173230;
    --ink-soft:#4C6461;
    --paper:#F6F3EA;
    --card:#FFFFFF;
    --teal-900:#0B4A45;
    --teal-700:#0F5C56;
    --teal-600:#12786D;
    --mint-400:#3FC9AE;
    --mint-100:#E3F6F1;
    --coral-600:#C9492B;
    --coral-100:#FBE7E1;
    --amber-500:#C8862B;
    --amber-100:#FBF0DD;
    --sky-500:#1C86B4;
    --sky-700:#125C79;
    --sky-100:#DEF2FA;
    --violet-500:#5B3FBF;
    --violet-100:#EEE8FC;
    --line: rgba(11,74,69,0.14);
    --shadow: 0 12px 30px -14px rgba(11,74,69,0.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    justify-content:center;
    padding: 28px 12px 48px;
  }
  a{color:inherit;}
  .device{
    width:100%;
    max-width:420px;
    background: var(--card);
    border-radius: 32px;
    border:1px solid var(--line);
    box-shadow: var(--shadow);
    overflow:hidden;
    min-height: 760px;
    display:flex;
    flex-direction:column;
    position:relative;
  }
  #app{ flex:1; display:flex; flex-direction:column; }
  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding: 18px 20px 12px;
  }
  .topbar h1{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size: 18px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .iconbtn{
    width:36px;height:36px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background: var(--mint-100);
    border:none; cursor:pointer; color: var(--teal-700);
    flex-shrink:0;
  }
  .iconbtn:hover{ background:#d6f0e9; }
  .iconbtn:focus-visible, .btn-tile:focus-visible, .navitem:focus-visible, .tab:focus-visible, button:focus-visible{
    outline: 2.5px solid var(--teal-600); outline-offset:2px;
  }
  .spacer{width:36px;}

  /* ---------- Scroll area ---------- */
  .scroll{ flex:1; overflow-y:auto; padding: 4px 20px 20px; }
  .scroll::-webkit-scrollbar{ width:0; }

  /* ---------- Home ---------- */
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color: var(--teal-600); font-weight:600; margin: 6px 0 2px;
  }
  .hero-title{
    font-family:'Fraunces', serif; font-weight:600;
    font-size: 30px; line-height:1.12; margin: 4px 0 10px; letter-spacing:-0.01em;
  }
  .hero-title .grad{
    background: linear-gradient(100deg, var(--teal-700), var(--sky-500) 70%);
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .hero-sub{ color: var(--ink-soft); font-size:14.5px; line-height:1.55; margin:0 0 18px; }

  .hero-card{
    background: linear-gradient(160deg, var(--teal-900), var(--teal-700) 65%, var(--sky-700));
    border-radius:22px; padding:22px; color:#EFFAF7; position:relative; overflow:hidden;
    margin-bottom:22px;
  }
  .hero-card::after{
    content:""; position:absolute; right:-40px; top:-40px; width:150px; height:150px;
    background: radial-gradient(circle, rgba(63,201,174,0.35), transparent 70%);
  }
  .hero-card::before{
    content:""; position:absolute; left:-30px; bottom:-50px; width:130px; height:130px;
    background: radial-gradient(circle, rgba(28,134,180,0.35), transparent 70%);
  }
  .hero-card .cap{
    font-family:'IBM Plex Mono', monospace; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color: var(--mint-400); font-weight:600;
  }
  .hero-card h2{ font-family:'Fraunces', serif; font-weight:600; font-size:19px; margin:8px 0 6px; }
  .hero-card p{ font-size:13px; color:#CFEAE4; margin:0 0 16px; line-height:1.5; }
  .scan-cta{
    display:flex; align-items:center; gap:10px; background: var(--mint-400);
    color: var(--teal-900); font-weight:700; font-size:14px; border:none;
    padding:12px 16px; border-radius:14px; cursor:pointer; width:100%;
    font-family:'Inter'; position:relative; z-index:1;
  }
  .scan-cta:hover{ filter:brightness(1.05); }

  .grid4{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom: 22px; }
  .btn-tile{
    border:1px solid var(--line); background: var(--card); border-radius:18px;
    padding:16px 14px; text-align:left; cursor:pointer; display:flex; flex-direction:column; gap:22px;
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-tile:hover{ transform:translateY(-2px); box-shadow: 0 10px 20px -12px rgba(11,74,69,0.35); }
  .btn-tile .tile-icon{
    width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  }
  .btn-tile .tile-label{ font-weight:700; font-size:14px; }
  .btn-tile .tile-sub{ font-size:11.5px; color:var(--ink-soft); margin-top:-16px; }
  .tile-med .tile-icon{ background:var(--mint-100); color:var(--teal-700); }
  .tile-ins .tile-icon{ background:var(--violet-100); color:var(--violet-500); }
  .tile-inhaler .tile-icon{ background:var(--sky-100); color:var(--sky-700); }
  .tile-scan .tile-icon{ background:var(--teal-900); color:var(--mint-400); }

  .why-row{ display:flex; gap:10px; margin-bottom:8px; }
  .why{ flex:1; text-align:center; background:var(--mint-100); border-radius:14px; padding:12px 6px; }
  .why svg{ margin-bottom:6px; color:var(--teal-700); }
  .why span{ display:block; font-size:11px; font-weight:600; color:var(--teal-900); }

  /* ---------- Section heading on sub pages ---------- */
  .page-head{ margin: 4px 0 14px; }
  .page-head h2{ font-family:'Fraunces', serif; font-weight:600; font-size:21px; margin:2px 0 6px; }
  .page-head p{ color:var(--ink-soft); font-size:13.5px; margin:0; line-height:1.5; }

  /* ---------- Photos ---------- */
  .guide-photo{ width:100%; border-radius:16px; display:block; object-fit:cover; max-height:210px; }
  .photo-caption{ font-size:10px; color:var(--ink-soft); margin:5px 0 16px; text-align:right; opacity:0.8; }
  .list-banner{ position:relative; border-radius:18px; overflow:hidden; margin-bottom:16px; height:118px; }
  .list-banner img{ width:100%; height:100%; object-fit:cover; display:block; }
  .list-banner .overlay{ position:absolute; inset:0; background:linear-gradient(180deg, rgba(11,74,69,0) 35%, rgba(8,40,37,0.82)); display:flex; align-items:flex-end; padding:12px 14px; }
  .list-banner .overlay span{ color:#fff; font-size:12.5px; font-weight:700; }

  /* ---------- Medicine list ---------- */
  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--mint-100); border-radius:14px;
    padding:10px 14px; margin-bottom:14px; color:var(--teal-700);
  }
  .searchbar input{ border:none; background:transparent; outline:none; font-size:13.5px; width:100%; color:var(--ink); font-family:'Inter'; }
  .med-row{
    display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--line);
    border-radius:16px; margin-bottom:10px; cursor:pointer; background:var(--card);
  }
  .med-row:hover{ border-color: var(--mint-400); }
  .med-row .thumb{
    width:44px;height:44px;border-radius:12px; background:var(--mint-100); color:var(--teal-700);
    display:flex;align-items:center;justify-content:center; flex-shrink:0;
  }
  .med-row.thumb-alert .thumb{ background:var(--coral-100); color:var(--coral-600); }
  .med-row .info{ flex:1; min-width:0; }
  .med-row .info h3{ margin:0; font-size:14px; font-weight:700; }
  .med-row .info .tag{ font-family:'IBM Plex Mono', monospace; font-size:10.5px; color:var(--teal-600); text-transform:uppercase; letter-spacing:0.05em; }
  .chev{ color: var(--ink-soft); flex-shrink:0; }

  /* ---------- Med detail ---------- */
  .detail-card{
    display:flex; gap:14px; align-items:center; background:var(--mint-100); border-radius:18px; padding:16px; margin-bottom:16px;
  }
  .detail-card .thumb-lg{ width:56px;height:56px;border-radius:14px;background:var(--card);color:var(--teal-700);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:var(--shadow); }
  .detail-card h2{ font-family:'Fraunces', serif; font-size:18px; margin:0 0 2px; font-weight:600; }
  .detail-card .sub{ font-size:12.5px; color:var(--teal-700); font-weight:600; }
  .verified{ display:inline-flex; align-items:center; gap:5px; font-size:11px; color:var(--teal-700); font-weight:700; margin-top:6px; }

  .tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:16px; }
  .tab{ background:none; border:none; padding:9px 4px; margin-right:14px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; position:relative; font-family:'Inter'; }
  .tab.active{ color:var(--teal-900); }
  .tab.active::after{ content:""; position:absolute; left:0; right:0; bottom:-1px; height:2.5px; background:var(--teal-600); border-radius:2px; }

  .section-label{ font-weight:700; font-size:13.5px; margin: 16px 0 8px; display:flex; align-items:center; gap:7px; }
  .kv{ display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .kv .k{ color:var(--ink-soft); }
  .kv .v{ font-weight:600; font-family:'IBM Plex Mono', monospace; font-size:12.5px; }

  .checklist{ list-style:none; margin:0; padding:0; }
  .checklist li{ display:flex; gap:9px; align-items:flex-start; font-size:13.5px; line-height:1.5; margin-bottom:9px; }
  .checklist li svg{ flex-shrink:0; margin-top:2px; color:var(--teal-600); }

  .step-row{ display:flex; gap:12px; margin-bottom:16px; align-items:flex-start; }
  .step-badge{ width:34px;height:34px;border-radius:10px;background:var(--mint-100);color:var(--teal-700);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .step-row h4{ margin:0 0 3px; font-size:13.5px; font-weight:700; }
  .step-row p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }

  .tip-box{ background:var(--amber-100); border-radius:14px; padding:13px 14px; font-size:12.5px; color:#7A4E17; display:flex; gap:9px; margin-top:6px; }
  .missed-box{ background:var(--sky-100); border-radius:14px; padding:13px 14px; font-size:12.5px; color:var(--sky-700); display:flex; gap:9px; margin-top:10px; }
  .missed-box svg{ flex-shrink:0; margin-top:1px; }

  .warn-row{ display:flex; gap:11px; align-items:flex-start; background:var(--coral-100); border-radius:14px; padding:13px; margin-bottom:10px; }
  .warn-row svg{ color:var(--coral-600); flex-shrink:0; margin-top:1px; }
  .warn-row p{ margin:0; font-size:13px; line-height:1.5; }

  .emergency-box{ background:var(--coral-600); color:#fff; border-radius:16px; padding:15px; display:flex; gap:11px; margin: 6px 0 18px; }
  .emergency-box p{ margin:0; font-size:13px; line-height:1.5; font-weight:500; }
  .emergency-box b{ display:block; font-size:13.5px; margin-bottom:3px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:6px; }
  .chip{ font-size:12px; font-weight:600; padding:6px 12px; border-radius:100px; }
  .chip-green{ background:var(--mint-100); color:var(--teal-700); }
  .chip-amber{ background:var(--amber-100); color:#7A4E17; }
  .chip-red{ background:var(--coral-100); color:var(--coral-600); }

  .interact-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px dashed var(--line); font-size:13px; }
  .interact-row .dot{ width:7px;height:7px;border-radius:50%; background:var(--amber-500); flex-shrink:0; }
  .interact-row.dot-red .dot{ background: var(--coral-600); }

  .save-btn{
    width:100%; background: var(--teal-700); color:#fff; border:none; border-radius:14px;
    padding:14px; font-weight:700; font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:8px;
    font-family:'Inter'; margin-top:10px;
  }
  .save-btn:hover{ background: var(--teal-900); }

  /* ---------- Insulin / Inhaler ---------- */
  .video-card{
    background: linear-gradient(160deg, var(--teal-900), var(--sky-700)); border-radius:18px; padding:18px; color:#EFFAF7; margin-bottom:20px;
    display:flex; flex-direction:column; gap:10px;
  }
  .video-thumb{
    background: rgba(255,255,255,0.06); border:1px dashed rgba(255,255,255,0.25); border-radius:14px;
    aspect-ratio: 16/9; display:flex; align-items:center; justify-content:center; position:relative;
  }
  .playbtn{
    width:54px;height:54px;border-radius:50%; background:var(--mint-400); color:var(--teal-900);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 18px -4px rgba(0,0,0,0.4);
  }
  .video-card h3{ font-family:'Fraunces', serif; font-size:16px; margin:2px 0 0; font-weight:600; }
  .video-card p{ font-size:12.5px; color:#CFEAE4; margin:0; line-height:1.5; }
  .video-link{
    align-self:flex-start; background:var(--mint-400); color:var(--teal-900); font-weight:700;
    font-size:12.5px; padding:9px 14px; border-radius:100px; text-decoration:none; margin-top:4px;
  }

  .type-card{ border:1px solid var(--line); border-radius:16px; padding:14px; margin-bottom:10px; }
  .type-card .name{ font-weight:700; font-size:13.5px; margin-bottom:3px; }
  .type-card .meta{ font-family:'IBM Plex Mono', monospace; font-size:11px; color:var(--teal-600); margin-bottom:6px; }
  .type-card p{ margin:0; font-size:12.5px; color:var(--ink-soft); line-height:1.5; }

  .temp-card{ display:flex; gap:12px; align-items:center; border:1px solid var(--line); border-radius:16px; padding:13px 14px; margin-bottom:10px; }
  .temp-card .temp-ico{ width:38px;height:38px;border-radius:11px;background:var(--sky-100);color:var(--sky-700);display:flex;align-items:center;justify-content:center;flex-shrink:0; }
  .temp-card .temp-num{ font-family:'IBM Plex Mono', monospace; font-weight:700; font-size:14.5px; color:var(--sky-700); }
  .temp-card .temp-label{ font-size:11.5px; color:var(--ink-soft); }

  /* ---------- Scan page ---------- */
  .scan-frame{
    position:relative; border-radius:20px; overflow:hidden; aspect-ratio:1/1; background:#0d1f1c;
    display:flex; align-items:center; justify-content:center; margin-bottom:16px; border:1px solid var(--line);
  }
  .scan-frame video, .scan-frame canvas{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .corner{ position:absolute; width:34px; height:34px; border-color:var(--mint-400); z-index:2; }
  .corner.tl{ top:16px; left:16px; border-top:3px solid; border-left:3px solid; border-radius:8px 0 0 0; }
  .corner.tr{ top:16px; right:16px; border-top:3px solid; border-right:3px solid; border-radius:0 8px 0 0; }
  .corner.bl{ bottom:16px; left:16px; border-bottom:3px solid; border-left:3px solid; border-radius:0 0 0 8px; }
  .corner.br{ bottom:16px; right:16px; border-bottom:3px solid; border-right:3px solid; border-radius:0 0 8px 0; }
  .laser{ position:absolute; left:14%; right:14%; height:2px; background:var(--mint-400); box-shadow:0 0 12px var(--mint-400); z-index:2;
    animation: sweep 2.1s ease-in-out infinite; }
  @media (prefers-reduced-motion: reduce){ .laser{ animation: none; top:50%; } }
  @keyframes sweep{ 0%{ top:16%; } 50%{ top:82%; } 100%{ top:16%; } }
  .scan-placeholder{ color:#8fb9b2; font-size:12.5px; text-align:center; padding:0 30px; }
  .scan-actions{ display:flex; flex-direction:column; gap:10px; }
  .btn-primary{ background:var(--teal-700); color:#fff; border:none; border-radius:14px; padding:13px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Inter'; }
  .btn-primary:hover{ background:var(--teal-900); }
  .btn-ghost{ background:var(--mint-100); color:var(--teal-700); border:none; border-radius:14px; padding:13px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Inter'; }
  .demo-note{ font-size:11.5px; color:var(--ink-soft); background:var(--mint-100); border-radius:12px; padding:10px 12px; margin-top:14px; line-height:1.5; }
  .demo-note code{ background:#fff; padding:1px 5px; border-radius:5px; font-family:'IBM Plex Mono'; }

  /* ---------- QR code ---------- */
  .qr-card{ background:var(--mint-100); border-radius:16px; padding:16px; display:flex; flex-direction:column; align-items:center; text-align:center; margin-top:4px; }
  .qr-img{ background:#fff; border-radius:12px; padding:10px; box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; width:148px; height:148px; }
  .qr-img canvas, .qr-img img{ display:block; width:128px; height:128px; image-rendering:pixelated; }
  .qr-code-text{ font-family:'IBM Plex Mono', monospace; font-size:12px; font-weight:600; color:var(--teal-700); margin-top:10px; letter-spacing:0.03em; }
  .qr-caption{ font-size:11.5px; color:var(--ink-soft); margin:6px 0 0; line-height:1.5; max-width:260px; }
  .qr-download{ margin-top:12px; background:var(--teal-700); color:#fff; border:none; border-radius:12px; padding:9px 16px; font-weight:700; font-size:12.5px; cursor:pointer; font-family:'Inter'; text-decoration:none; display:inline-block; }
  .qr-download:hover{ background:var(--teal-900); }
  .qr-sheet-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:10px; }
  .qr-sheet-cell{ background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .qr-sheet-cell .qr-img{ width:104px; height:104px; padding:6px; }
  .qr-sheet-cell .qr-img canvas, .qr-sheet-cell .qr-img img{ width:88px; height:88px; }
  .qr-sheet-cell h4{ font-size:12px; margin:8px 0 1px; font-family:'Inter'; font-weight:700; }
  .qr-sheet-cell .qr-code-text{ font-size:10.5px; margin-top:2px; }
  .qr-link-btn{ background:var(--teal-700); color:#fff; border:none; border-radius:14px; padding:13px; font-weight:700; font-size:13.5px; cursor:pointer; font-family:'Inter'; width:100%; margin-top:10px; }
  .qr-link-btn:hover{ background:var(--teal-900); }
  .scan-status{ text-align:center; font-size:13px; font-weight:600; color:var(--teal-700); margin-bottom:10px; min-height:18px; }

  /* ---------- Bottom nav ---------- */
  .bottom-nav{
    display:flex; border-top:1px solid var(--line); background:var(--card); padding: 8px 6px 14px;
  }
  .navitem{
    flex:1; background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--ink-soft); font-size:10px; font-weight:600; cursor:pointer; padding:6px 2px; font-family:'Inter';
  }
  .navitem.active{ color:var(--teal-700); }
  .navitem .ni-ico{ width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center; }
  .navitem.active .ni-ico{ background:var(--mint-100); }

  @media (max-width:400px){
    .device{ border-radius:0; min-height:100vh; }
    body{ padding:0; }
  }
</style>
</head>
<body>
<div class="device"><div id="app"></div></div>

<script>
/* ============ ICONS ============ */
const ic = {
  home: `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1H9a1 1 0 0 0 1-1v-4a1 1 0 0 1 1-1h2a1 1 0 0 1 1 1v4a1 1 0 0 0 1 1h2.5a1 1 0 0 0 1-1v-9"/></svg>`,

/* ============ STATE ============ */
let state = { page:'home', medId:null, tab:'overview', search:'', scanning:false, scanMsg:'', scanFound:null, stream:null };
const app = document.getElementById('app');

function go(page, opts={}){
  stopCamera();
  state.page = page;
  Object.assign(state, opts);
  window.scrollTo(0,0);
  render();
}
function setTab(t){ state.tab = t; render(); }

/* ============ RENDER ROOT ============ */
function render(){
  app.innerHTML = pageTopbar() + `<div class="scroll">${pageBody()}</div>` + bottomNav();
  if(state.page === 'scan') wireScanPage();
  const back = document.getElementById('backbtn');
  if(back) back.onclick = () => go('home');
  const s = document.getElementById('searchinput');
  if(s) s.oninput = (e)=>{ state.search = e.target.value; renderListOnly(); };
  const dl = document.getElementById('qrDownloadBtn');
  if(dl) dl.onclick = () => downloadQR('qrcode-detail', MEDS.find(m=>m.id===state.medId).code);
  renderAllQRCodes();
}

function renderListOnly(){
  const list = document.getElementById('medlist');
  if(list) list.innerHTML = medRows();
}

function pageTopbar(){
  if(state.page==='home'){
    return `<div class="topbar"><h1>Smart Drug Assistant</h1><div class="iconbtn">${ic.heartline}</div></div>`;
  }
  const titles = { medlist:'Medicines', meddetail: state.medId? MEDS.find(m=>m.id===state.medId).name : '', insulin:'Insulin Guide', inhaler:'Asthma Inhaler Guide', scan:'Scan Medicine QR', qrsheet:'All QR Codes' };
  return `<div class="topbar"><button class="iconbtn" id="backbtn" aria-label="Back">${ic.back}</button><h1>${titles[state.page]||''}</h1><div class="spacer"></div></div>`;
}

function bottomNav(){
  const items = [
    ['home','home','Home'], ['medlist','pill','Medicines'], ['scan','scan','Scan'],
    ['insulin','droplet','Insulin'], ['inhaler','inhaler','Inhaler']
  ];
  return `<div class="bottom-nav">${items.map(([p,i,label])=>`
    <button class="navitem ${state.page===p||(p==='medlist'&&state.page==='meddetail')?'active':''}" onclick="go('${p}')">
      <span class="ni-ico">${ic[i]}</span>${label}
    </button>`).join('')}</div>`;
}

/* ============ PAGE BODIES ============ */
function pageBody(){
  switch(state.page){
    case 'home': return homePage();
    case 'medlist': return medListPage();
    case 'meddetail': return medDetailPage();
    case 'insulin': return insulinPage();
    case 'inhaler': return inhalerPage();
    case 'scan': return scanPage();
    case 'qrsheet': return qrSheetPage();
    default: return homePage();
  }
}

function medRows(){
  const q = state.search.trim().toLowerCase();
  const filtered = MEDS.filter(m => !q || m.name.toLowerCase().includes(q) || m.cls.toLowerCase().includes(q));
  if(filtered.length===0) return `<p style="color:var(--ink-soft);font-size:13px;">No medicines match "${state.search}".</p>`;
  return filtered.map(m => `
    <div class="med-row" onclick="go('meddetail',{medId:${m.id}, tab:'overview'})" tabindex="0" role="button">
      <span class="thumb">${ic.pill}</span>
      <span class="info"><h3>${m.name} ${m.strength}</h3><span class="tag">${m.form} · ${m.cls}</span></span>
      <span class="chev">${ic.chev}</span>
    </div>`).join('');
}

/* ============ SCAN PAGE ============ */
let jsQRLoaded = false;
function loadJsQR(cb){
  if(window.jsQR){ jsQRLoaded=true; return cb(); }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.js';
  s.onload = ()=>{ jsQRLoaded=true; cb(); };
  s.onerror = ()=>{ cb(); };
  document.head.appendChild(s);
}

/* ============ QR GENERATION ============ */
// Each medicine's `code` field (e.g. "SDA-MED-01") is the exact payload
// encoded into its QR image, and the same value the scanner (handleScanResult)
// matches against — so a printed/generated QR always opens the right page.
let qrLibLoaded = false;
function loadQRLib(cb){
  if(window.QRCode){ qrLibLoaded=true; return cb(); }
  const s = document.createElement('script');
  s.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
  s.onload = ()=>{ qrLibLoaded=true; cb(); };
  s.onerror = ()=>{ cb(); };
  document.head.appendChild(s);
}

function renderQRInto(containerId, text, size){
  const el = document.getElementById(containerId);
  if(!el) return;
  el.innerHTML = '';
  if(window.QRCode){
    new QRCode(el, {
      text: text,
      width: size, height: size,
      colorDark: '#0B4A45',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    el.innerHTML = `<span style="font-size:10px;color:var(--ink-soft);">QR unavailable offline</span>`;
  }
}

function renderAllQRCodes(){
  loadQRLib(()=>{
    if(state.page==='meddetail' && state.tab==='overview' && state.medId!=null){
      renderQRInto('qrcode-detail', MEDS.find(m=>m.id===state.medId).code, 128);
    }
    if(state.page==='qrsheet'){
      MEDS.forEach(m=> renderQRInto('qrcode-sheet-'+m.id, m.code, 88));
    }
  });
}

function downloadQR(containerId, filename){
  const el = document.getElementById(containerId);
  const canvas = el && el.querySelector('canvas');
  if(!canvas) return;
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = filename + '.png';
  a.click();
}

function scanPage(){
  return `

  </div>

    <button class="btn-primary" id="startScanBtn">${state.scanning? 'Stop Camera' : 'Start Camera Scan'}</button>
    <button class="btn-ghost" id="simulateBtn">Simulate a scan (demo)</button>
  </div>
  <button class="qr-link-btn" onclick="go('qrsheet')">${ic.scan} View all medicine QR codes</button>
  <div class="demo-note">Every medicine in the library now has its own QR code (e.g. <code>SDA-MED-01</code>), viewable on its detail page or all together on the QR codes sheet above — scan any of them here for an instant match.</div>`;

function wireScanPage(){
  const startBtn = document.getElementById('startScanBtn');
  const simBtn = document.getElementById('simulateBtn');
  if(startBtn) startBtn.onclick = toggleCamera;
  if(simBtn) simBtn.onclick = simulateScan;
}

function stopCamera(){
  if(state.stream){ state.stream.getTracks().forEach(t=>t.stop()); state.stream=null; }
  state.scanning=false;
}

async function toggleCamera(){
  if(state.scanning){ stopCamera(); state.scanMsg=''; render(); return; }
  state.scanMsg = 'Requesting camera access…'; render();
  try{
    const stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:'environment' } });
    state.stream = stream; state.scanning = true;
    const video = document.createElement('video');
    video.setAttribute('playsinline',''); video.autoplay = true; video.srcObject = stream;
    const frame2 = document.getElementById('scanframe');
    const ph = document.getElementById('scanplaceholder'); if(ph) ph.remove();
    const laser = document.getElementById('laser'); if(laser) laser.style.display='block';
    frame2.prepend(video);
    const canvas = document.createElement('canvas'); canvas.style.display='none'; frame2.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    document.getElementById('startScanBtn').textContent = 'Stop Camera';
    document.querySelector('.scan-status').textContent = 'Scanning… hold the QR code steady inside the frame.';
    loadJsQR(()=>tick(video, canvas, ctx));
  }catch(err){
    state.scanMsg = 'Camera unavailable in this environment. Try "Simulate a scan" instead.';
    render();
  }
}

function tick(video, canvas, ctx){
  if(!state.scanning) return;
  if(video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR){
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imgData = ctx.getImageData(0,0,canvas.width,canvas.height);
    const code = window.jsQR(imgData.data, imgData.width, imgData.height);
    if(code && code.data){ handleScanResult(code.data); return; }
  }
  requestAnimationFrame(()=>tick(video, canvas, ctx));
}

function handleScanResult(text){
  const match = MEDS.find(m => m.code === text.trim());
  stopCamera();
  if(match){
    go('meddetail', { medId: match.id, tab:'overview' });
  } else {
    state.scanMsg = `QR read: "${text}". No matching medicine found in the demo library — try browsing manually.`;
    render();
  }
}

function simulateScan(){
  document.querySelector('.scan-status').textContent = 'Reading medicine information…';
  document.getElementById('laser').style.display='block';
  const pick = MEDS[Math.floor(Math.random()*MEDS.length)];
  setTimeout(()=>{ go('meddetail', { medId: pick.id, tab:'overview' }); }, 900);
}

/* ============ INIT ============ */
render();
</script>
